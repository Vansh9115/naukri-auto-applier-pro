[supervisord]
nodaemon=true
user=root
logfile=/dev/null
logfile_maxbytes=0

; Virtual display the (always non-headless) browser renders into.
[program:xvfb]
command=Xvfb :99 -screen 0 1280x800x24 -nolisten tcp
autorestart=true
priority=1
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

; Shares that virtual display over VNC (no password — this is meant for
; local-only access via the docker-compose port mapping, not for exposing
; the container directly to the internet).
[program:x11vnc]
command=x11vnc -display :99 -forever -shared -nopw -rfbport 5900
autorestart=true
priority=2
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

; Browser-based VNC client, so seeing/clicking the containerized Chrome
; window (e.g. for the one-time Google login) only needs a browser tab —
; no VNC client software to install.
[program:novnc]
command=websockify --web=/usr/share/novnc 6080 localhost:5900
autorestart=true
priority=3
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:webapp]
command=python web_app.py
directory=/app
environment=DISPLAY=":99"
autorestart=true
priority=4
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
