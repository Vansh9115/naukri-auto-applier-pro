name: Build and Publish Docker Image

# Publishes to GitHub Container Registry on every push to main. Anyone
# running the container (via docker-compose.yml's `image:`) picks this up
# with `docker compose pull` — or automatically if they're running
# Watchtower (see DOCKER.md).
on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          # Hardcoded lowercase, not ${{ github.repository }} — GHCR/Docker
          # image names must be all-lowercase, but this repo's owner
          # ("Vansh9115") isn't, so that expression would fail the push.
          tags: |
            ghcr.io/vansh9115/naukri-auto-applier-pro:latest
            ghcr.io/vansh9115/naukri-auto-applier-pro:build-${{ github.run_number }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
